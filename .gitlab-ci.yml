image: node:20
stages:
  - build
  - test

build_website:
  stage: build
  tags: 
    - coco-mac
  script:
    - cd frontend
    - npm install --include=dev
    - npm run build
  only:
    - main

jest_unit_tests: 
  stage: test
  tags: 
    - coco-mac
  script:
    - cd frontend
    - npm install --include=dev
    - CI=true npm test -- --watchAll=false
  only:
    - main

selenium_acceptance_tests: 
  stage: test
  tags: 
    - coco-mac
  image: python:3.12
  before_script:
  - apt-get update
  - apt-get install -y chromium
  script:
    - cd frontend
    - python3 guitests.py
  only:
    - main

backend_tests: 
  stage: test
  tags: 
    - coco-mac
  image: python:3.12
  before_script:
    - pip install -r backend/requirements.txt
  script:
    - cd backend
    - python3 tests.py

postman_api_tests:
  stage: test
  tags: 
    - coco-mac
  image:
    name: postman/newman:alpine
    entrypoint: [""]
  script:
    - newman --version
    - newman run postman/collection.json --reporters cli
  only: 
    - main