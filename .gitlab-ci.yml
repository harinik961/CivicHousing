image: node:20
stages:
  - build
  - test

build_website:
  stage: build
  script:
    - cd frontend
    - npm install --include=dev
    - npm run build
  only:
    - main

postman_api_tests:
  stage: test
  image:
    name: postman/newman:alpine
    entrypoint: [""]
  script:
    - newman --version
    - newman run postman/collection.json --reporters cli